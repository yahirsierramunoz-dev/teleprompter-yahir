<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Teleprompter Yahir</title>
<style>
@font-face{font-family:'TP Inter';src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'TP Manrope';src:url(fonts/manrope.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'TP Space Grotesk';src:url(fonts/space-grotesk.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'TP Sora';src:url(fonts/sora.woff2) format('woff2');font-weight:100 800;font-display:swap}
@font-face{font-family:'TP Orbitron';src:url(fonts/orbitron.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'TP Oswald';src:url(fonts/oswald.woff2) format('woff2');font-weight:200 700;font-display:swap}
@font-face{font-family:'TP Playfair';src:url(fonts/playfair-display.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'TP Lora';src:url(fonts/lora.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'TP Mono';src:url(fonts/jetbrains-mono.woff2) format('woff2');font-weight:100 800;font-display:swap}
:root{
  --bg:#05060b; --fg:#f2f5fb; --muted:#8b93a7;
  --accent:#6ee7ff; --accent2:#8b7bff; --soft:rgba(110,231,255,.10); --on:#04121a;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.10);
  --glow1:rgba(94,110,255,.20); --glow2:rgba(0,229,255,.11);
  --hi:#d7faff; --metal:#9fb0cf;
  --grad:linear-gradient(135deg,var(--hi) 0%,var(--accent) 44%,var(--accent2) 100%);
  --mbg:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 52%,rgba(0,0,0,.18)),linear-gradient(135deg,var(--hi) 0%,var(--accent) 44%,var(--accent2) 100%);
  --edge:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif; --wght:700; --lh:1.28; --ls:-.02em;
  --size:48px; --width:92%;
  --panel:#12141c; --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 55% at 12% -8%,var(--glow1),transparent 62%),
             radial-gradient(90% 45% at 112% 2%,var(--glow2),transparent 58%)}
button{font-family:inherit;color:inherit}
button:focus{outline:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex;animation:scrIn .5s var(--ease) both}
@keyframes scrIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* HOME */
#home{padding:calc(30px + env(safe-area-inset-top)) 20px calc(34px + env(safe-area-inset-bottom));overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hgear{position:absolute;top:calc(24px + env(safe-area-inset-top));right:18px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);background:var(--glass2);color:var(--fg);transition:transform .35s var(--ease),filter .2s}
.hgear:active{transform:scale(.92)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:50px;height:50px;border-radius:14px;box-shadow:0 10px 28px -6px rgba(0,0,0,.7),0 0 0 1px var(--line)}
#home .brand{padding-right:54px}
#home h1{margin:0;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.9px;
  background:linear-gradient(180deg,var(--fg) 25%,var(--metal));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.2px}
#status{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);margin:18px 0 2px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
#status.ok::before{background:#4ade80;box-shadow:0 0 10px #4ade80;animation:pulse 2.6s ease-in-out infinite}
#status.warn::before{background:#fbbf24;box-shadow:0 0 10px #fbbf24}
.group{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:2.2px;margin:28px 4px 12px}
.card{position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:17px 16px 17px 20px;margin-bottom:11px;
  border-radius:22px;border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg);
  background:linear-gradient(160deg,var(--glass2),var(--glass));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 32px -14px rgba(0,0,0,.65);
  transition:transform .45s var(--ease),border-color .3s,background .3s;
  animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.card:active{transform:scale(.968);transition-duration:.14s;border-color:var(--accent)}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-size:17px;font-weight:600;letter-spacing:-.25px;line-height:1.25}
.card span{display:block;font-size:13px;color:var(--muted);margin-top:5px}
.card .go{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--mbg);color:var(--on);
  box-shadow:var(--edge),0 8px 20px -8px var(--accent)}
.card .go svg{margin-left:2px}
#empty{color:var(--muted);font-size:15px;line-height:1.55;padding:20px 4px}
#installBtn{display:none;margin-top:12px;animation:none}
#install{display:none;margin-top:16px;font-size:13px;color:var(--muted);line-height:1.55;padding:0 4px}

/* READER */
#bar{position:relative;z-index:3;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0));
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5)}
#bar .b{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer;
  transition:transform .35s var(--ease),background .25s}
#bar .b:active{transform:scale(.92);background:var(--glass2);transition-duration:.12s}
#bar #gear{width:38px;padding:0;justify-content:center}
#bar #title{flex:1;min-width:0;text-align:center;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewport{flex:1;position:relative;overflow:hidden}
#mirrorBox{position:absolute;inset:0}
#mirrorBox.mirror{transform:scaleX(-1)}
#scroller{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;contain:layout paint;will-change:scroll-position}
#scroller::-webkit-scrollbar{display:none}
#content{width:var(--width);max-width:100%;box-sizing:border-box;margin:0 auto;text-align:center;font-family:var(--font);font-weight:var(--wght);font-size:var(--size);line-height:var(--lh);
  letter-spacing:var(--ls);text-wrap:balance;overflow-wrap:break-word;word-break:break-word;-webkit-user-select:text;user-select:text;transform:translateZ(0)}
.ln{margin:0 0 .85em;max-width:100%;overflow-wrap:break-word;word-break:break-word;transition:opacity .5s var(--ease),transform .5s var(--ease);transform-origin:center}
.dim .ln{opacity:.2;transform:scale(.93)}
.dim .ln.cur{opacity:1;transform:scale(1)}
.vd{position:relative;width:100vw;margin:120px 0 100px calc(50% - 50vw);padding:44px 0 46px;font-size:16px;letter-spacing:0;
  display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;font-family:var(--font);
  background:linear-gradient(180deg,transparent,var(--soft) 22%,var(--soft) 78%,transparent);
  isolation:isolate;overflow:hidden;contain:paint}
.vd.endmark{margin-top:90px;padding:30px 0}
.vd .rule{width:100%;height:5px;background:linear-gradient(90deg,transparent 0%,var(--accent) 30%,var(--hi) 50%,var(--accent) 70%,transparent 100%);
  box-shadow:0 0 22px var(--accent),0 0 6px var(--hi);border-radius:3px;transform:translateZ(0)}
.vd .end{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;border:2px solid var(--accent);
  font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);background:var(--glass);
  box-shadow:0 0 20px -4px var(--accent);transform:translateZ(0);max-width:90vw}
.vd .end::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.vd .big{max-width:92vw;white-space:normal;overflow-wrap:break-word;word-break:break-word;font-size:min(calc(var(--size) * 1.7),16vw);font-weight:900;letter-spacing:.08em;line-height:1.02;text-transform:uppercase;
  padding-left:.08em;background:linear-gradient(180deg,#fff 0%,var(--hi) 22%,var(--accent) 58%,var(--accent2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px var(--accent));transform:translateZ(0)}
.vd .new{font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);padding-left:.24em;max-width:94vw}
#guide{position:absolute;left:0;right:0;pointer-events:none;opacity:1;transition:opacity .35s var(--ease)}
#guide::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:4px;border-radius:0 4px 4px 0;
  background:var(--grad);box-shadow:0 0 18px var(--accent)}
#guide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--soft),transparent 82%)}
#guide.off{display:none}
#guide.onvd{opacity:0}
#fadeTop,#fadeBot{position:absolute;left:0;right:0;pointer-events:none;z-index:2}
#fadeTop{top:0;height:15%;background:linear-gradient(to bottom,var(--bg),transparent);opacity:.94}
#fadeBot{bottom:0;height:30%;background:linear-gradient(to top,var(--bg),transparent);opacity:.96}
#viewport.line #fadeTop,#viewport.line #fadeBot{display:none}
#viewport.metal .ln,#viewport.metal #lineText{background:linear-gradient(180deg,var(--fg) 0%,var(--fg) 34%,var(--metal) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

#lineView{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:6vw;text-align:center}
#lineView.active{display:flex}
#lineText{font-family:var(--font);font-weight:var(--wght);font-size:var(--size);line-height:var(--lh);letter-spacing:var(--ls);width:var(--width);max-width:100%;box-sizing:border-box;overflow-wrap:break-word;word-break:break-word;
  text-wrap:balance;-webkit-user-select:text;user-select:text}
#lineText.in{animation:lineIn .5s var(--ease) both}
@keyframes lineIn{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
#lineNext{position:absolute;bottom:3vh;left:0;right:0;padding:0 8vw;font-size:15px;color:var(--muted)}
#lineDivider{max-width:92vw;white-space:normal;overflow-wrap:break-word;word-break:break-word;font-size:min(calc(var(--size) * 1.7),16vw);font-weight:900;letter-spacing:.08em;line-height:1.02;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,var(--hi) 22%,var(--accent) 58%,var(--accent2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px var(--accent));transform:translateZ(0)}
#lineEnd{display:none;margin-bottom:26px;padding:10px 22px;border-radius:999px;border:2px solid var(--accent);font-size:15px;font-weight:800;transform:translateZ(0);max-width:90vw;
  letter-spacing:.2em;text-transform:uppercase;color:var(--fg);background:var(--glass);box-shadow:0 0 20px -4px var(--accent)}
#lineEnd.on{display:block}
#lineTap{font-size:14px;color:var(--muted);margin-top:16px}

#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
  background:rgba(3,4,9,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#count.active{display:flex}
#cn{font-style:normal;font-size:38vw;font-weight:200;line-height:1;letter-spacing:-.04em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 40px var(--accent));max-width:90vw;white-space:nowrap;text-align:center}
#cn.wide{font-size:19vw;letter-spacing:-.02em}
#cn.pop{animation:cdPop .6s var(--ease) both}
@keyframes cdPop{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}

#ctrl{position:relative;z-index:3;flex:0 0 auto;display:flex;justify-content:center;padding:6px 14px calc(14px + env(safe-area-inset-bottom))}
#ctrlScroll,#ctrlLine{align-items:center;gap:12px;padding:10px 12px;border-radius:36px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 44px -18px rgba(0,0,0,.75)}
#ctrl{transition:opacity .3s var(--ease)}
body.sheetopen #ctrl{opacity:0;pointer-events:none}
#ctrl button{border:none;cursor:pointer;transition:transform .4s var(--ease),filter .2s,background .2s}
#ctrl button:active{transform:scale(.9);transition-duration:.12s}
.round{width:58px;height:58px;border-radius:50%;font-size:28px;font-weight:300;line-height:1;
  background:var(--glass2);border:1px solid var(--line)!important;color:var(--fg)}
.play{flex:0 0 76px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--mbg);color:var(--on);
  box-shadow:var(--edge),0 12px 30px -8px var(--accent)}
.play.on{animation:glowPulse 2.4s ease-in-out infinite;will-change:box-shadow}
@keyframes glowPulse{0%,100%{box-shadow:var(--edge),0 12px 30px -8px var(--accent)}
  50%{box-shadow:var(--edge),0 12px 46px -4px var(--accent)}}
#spd{min-width:58px;text-align:center;font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
#spd b{display:block;font-size:24px;font-weight:600;letter-spacing:-.5px;color:var(--fg);font-variant-numeric:tabular-nums;margin-bottom:1px}
#ctrlLine{display:none;width:100%;max-width:520px}
#ctrlLine button{flex:1;height:58px;border-radius:29px;font-size:17px;font-weight:600;background:var(--glass2);color:var(--fg);border:1px solid var(--line)}
#ctrlLine button.primary{background:var(--mbg);color:var(--on);border:none;box-shadow:var(--edge),0 12px 28px -10px var(--accent)}

/* PRONUNCIADOR */
#pronBar{position:absolute;left:12px;right:12px;bottom:16px;z-index:6;display:flex;align-items:center;gap:8px;
  padding:9px 10px 9px 16px;border-radius:22px;background:rgba(14,16,26,.88);border:1px solid rgba(255,255,255,.14);color:#f2f5fb;
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);
  opacity:0;transform:translateY(24px) scale(.96);pointer-events:none;
  transition:opacity .3s var(--ease),transform .5s var(--spring)}
#pronBar.show{opacity:1;transform:none;pointer-events:auto}
#pronWord{flex:1;min-width:0;font-size:15px;font-weight:600;color:#f2f5fb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  -webkit-user-select:none;user-select:none}
#pronBar button{border:none;border-radius:14px;height:40px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
  background:var(--mbg);color:var(--on);box-shadow:var(--edge);transition:transform .3s var(--ease)}
#pronBar button:active{transform:scale(.9);transition-duration:.1s}
#pronBar button.alt{background:rgba(255,255,255,.12);color:#f2f5fb}
#pronBar{flex-wrap:wrap;row-gap:8px}
#pronWord{order:1}
#pronBar button.x{order:2}
#pronLangs{order:3;flex:0 0 100%;display:flex;gap:6px}
#pronLangs button{flex:1;min-width:0;padding:0 2px;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
#pronLangs button span{font-size:19px}
#pronLangs button small{font-size:9.5px;font-weight:700;letter-spacing:.06em}
#pronBar button.x{background:none;color:#9aa3b8;width:34px;padding:0;font-size:17px;font-weight:400}

/* AJUSTES (hoja translúcida: el guion se ve detrás y se actualiza en vivo) */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;visibility:hidden;pointer-events:none;
  transition:visibility 0s linear .6s}
#sheet.active{visibility:visible;transition-delay:0s}
#panel{pointer-events:auto;width:100%;height:56vh;min-height:350px;max-height:520px;display:flex;flex-direction:column;gap:12px;
  padding:6px 18px calc(14px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;color:#f2f5fb;
  border:1px solid rgba(255,255,255,.14);border-bottom:none;
  background:linear-gradient(180deg,rgba(30,34,52,.78),rgba(10,12,20,.90));
  backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);
  box-shadow:0 -24px 70px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(105%);transition:transform .55s var(--ease),background .3s,border-color .3s,box-shadow .3s}
#sheet.active #panel{transform:none}
#panel > *,.pane > *{transition:opacity .28s var(--ease)}
#sheet.ghost #panel{background:rgba(8,10,18,.05);border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#sheet.ghost #panel > :not(.panes){opacity:.08}
#sheet.ghost .pane > *{opacity:.08}
#sheet.ghost .pane > .live{opacity:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.75))}
#grab{flex:none;padding:10px 0 4px;cursor:grab;touch-action:none}
#grab i{display:block;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.26);margin:0 auto}
.panes{flex:1;min-height:0;overflow-y:auto;margin:0 -18px;padding:2px 18px 6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.panes::-webkit-scrollbar{display:none}
.pane{display:none;flex-direction:column;gap:14px}
.pane.active{display:flex;animation:paneIn .4s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#panel label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:#a4adc2;margin-bottom:-6px}
#panel label span{color:#f2f5fb;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent2),var(--accent) var(--p,50%),rgba(255,255,255,.16) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff,#d9deea 60%,#aeb6c8);box-shadow:0 3px 12px rgba(0,0,0,.6),inset 0 -2px 3px rgba(0,0,0,.2);
  transition:transform .25s var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}

.seg{position:relative;display:flex;padding:3px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}

.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 2px;padding-top:14px}
.sws button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0 5px;background:none;border:none;
  border-radius:14px;color:#9aa3b8;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .25s}
.sws button:active .gem{transform:scale(.88)}
.sws .gem{position:relative;display:block;width:46px;height:46px;transition:transform .5s var(--spring)}
.sws .gem svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 50%;backface-visibility:visible}
.sws .gem::after{content:'';position:absolute;left:50%;top:38%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 0,var(--c) 22%,transparent 65%);mix-blend-mode:screen}
.sws button.sel{color:#fff}
.sws button.sel .gem{transform:scale(1.18);filter:drop-shadow(0 0 9px var(--c))}
.sws .gem.jump{filter:drop-shadow(0 6px 10px var(--c))}
.sws button:not(.sel) .gem{opacity:.78}
.sws .gem.jump svg{animation:gemSpin .95s cubic-bezier(.3,.7,.3,1) both}
.sws .gem.jump::after{animation:gemGlow .95s ease-out both}
@keyframes gemSpin{
  0%{transform:perspective(240px) translateY(0) rotateY(0) scale(1);filter:brightness(1)}
  12%{transform:perspective(240px) translateY(3px) rotateY(0) scale(1.04,.94);filter:brightness(1.1)}
  38%{transform:perspective(240px) translateY(-17px) rotateY(150deg) scale(1.14);filter:brightness(1.9) saturate(1.3)}
  62%{transform:perspective(240px) translateY(-14px) rotateY(270deg) scale(1.14);filter:brightness(1.7) saturate(1.25)}
  82%{transform:perspective(240px) translateY(0) rotateY(360deg) scale(1.06,.94);filter:brightness(1.3)}
  92%{transform:perspective(240px) translateY(-4px) rotateY(360deg) scale(1);filter:brightness(1.15)}
  100%{transform:perspective(240px) translateY(0) rotateY(360deg) scale(1);filter:brightness(1)}}
@keyframes gemGlow{0%{opacity:0;transform:scale(.4)}35%{opacity:.95;transform:scale(1.15)}70%{opacity:.55;transform:scale(1.35)}100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.sws .gem.jump svg,.sws .gem.jump::after{animation:none}}

function gemSound(idx){
  if (!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + .01, out = AC.createGain(); out.gain.value = .5; out.connect(AC.destination);
    const base = 523.25 * Math.pow(2, [0,2,4,5,7,9,11,12,14,16,17,19][idx % 12] / 12);
    /* salto: barrido ascendente rápido */

    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.35, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);

}

const statusEl = $('status');
let lastStatus = null;
function setStatus(m, cls){ lastStatus = [m, cls]; refreshStatus(); }
function refreshStatus(){
  if (!lastStatus) return; const [m, cls] = lastStatus;
  statusEl.textContent = Array.isArray(m) ? t(m[0]) + (m[1] || '') : m; statusEl.className = cls || '';
}

function normalize(id, d){
  if (!d || !Array.isArray(d.videos)) return null;
  const videos = d.videos.map(v => ({
    title: String((v && v.title) || ''),
    lines: Array.isArray(v && v.lines) ? v.lines.map(String).filter(x => x.trim()) : []
  })).filter(v => v.lines.length);
  if (!videos.length || d.hidden) return null;
  return { id, title: String(d.title || id), group: String(d.group || 'Guiones'), order: Number(d.order) || 0, videos };
}

function applySnapshot(snap){
  const out = [];
  snap.docs.forEach(d => { const s = normalize(d.id, d.data()); if (s) out.push(s); });
  scripts = out; LS.set('tp3_cache', out); renderHome();
}
function fromJson(data){
  const out = [];
  (data && data.scripts || []).forEach(d => { const s = normalize(d.id || d.title, d); if (s) out.push(s); });
  scripts = out; LS.set('tp3_cache', out); renderHome();
}
let jsonBusy = false;
async function loadJson(){
  if (jsonBusy) return; jsonBusy = true;
  try{
    const r = await fetch('scripts.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    fromJson(data);
    if (r.headers.get('x-tp-cache')) setStatus(['offSaved', data.updated ? ' · ' + data.updated : ''], 'warn');
    else setStatus(['upToDate', data.updated ? ' · ' + data.updated : ''], 'ok');
  }catch(e){
    if (EMBEDDED){ fromJson(EMBEDDED); setStatus(['embedded', ' · ' + (EMBEDDED.updated || '')], 'ok'); }
    else setStatus([scripts.length ? 'offShowing' : 'failLoad'], 'warn');
  }
  jsonBusy = false;
}
(async function initData(){
  renderHome();
  setStatus([scripts.length ? 'updating' : 'loading'], 'warn');
  // Versión dentro de Claude: base de datos. Versión instalada: scripts.json.
  let db = null;
  try{ db = window.claude && await window.claude.use('db'); }catch(e){ db = null; }
  if (db){
    let timer = setTimeout(() => setStatus([scripts.length ? 'offShowing' : 'failLoad'], 'warn'), 10000);
    try{
      db.collection('scripts').onSnapshot(snap => {
        if (!snap.metadata.fromCache){ clearTimeout(timer); setStatus(['upToDate'], 'ok'); }
        applySnapshot(snap);
      }, err => { clearTimeout(timer); setStatus(['offShowing'], 'warn'); });
    }catch(e){ clearTimeout(timer); setStatus(['offShowing'], 'warn'); }
  } else {
    if (EMBEDDED && location.protocol === 'file:'){ fromJson(EMBEDDED); setStatus(['embedded', ' · ' + (EMBEDDED.updated || '')], 'ok'); }
    else loadJson();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('home').classList.contains('active')) loadJson(); });
    window.addEventListener('online', loadJson);
  }
})();

let guideY = 0, offs = [];
function cacheOffsets(){
  offs = [];
  if (!$('reader').classList.contains('active')) return;
  const ch = content.children;
  for (let i = 0; i < ch.length; i++) offs.push([ch[i].offsetTop, ch[i].offsetHeight]);
}
function layoutGuide(){
  const h = $('viewport').clientHeight || 600, top = Math.round(h * 0.34);
  const gh = Math.round(S.size * 1.5);

/* velocidad: líneas aproximadas por segundo, independiente del tamaño de letra */
function pxPerSec(){ return S.speed * S.size * 0.23; }
let vCur = 0, frame = 0;
function tick(ts){
  if (!running) return;
  const dt = Math.min(64, ts - last) / 1000; last = ts;
  vCur += (pxPerSec() - vCur) * Math.min(1, dt * 6);   /* acelera y cambia de velocidad con suavidad */
  pos += vCur * dt;
  const max = scroller.scrollHeight - scroller.clientHeight;
  if (pos >= max){ pos = max; scroller.scrollTop = pos; updateCur(); setRun(false); return; }
  scroller.scrollTop = pos;
  if ((++frame & 3) === 0) updateCur();
  raf = requestAnimationFrame(tick);
}
function setRun(on){
  if (on === running) return;
  running = on; document.body.classList.toggle('running', on); $('play').innerHTML = on ? ICON_PAUSE : ICON_PLAY; $('play').classList.toggle('on', on);
  if (on){ vCur = 0; last = performance.now(); raf = requestAnimationFrame(tick); }
  else { cancelAnimationFrame(raf); updateCur(); }
}
$('play').innerHTML = ICON_PLAY;
function countSound(n){
  if (!S.sound) return;
  try{
    if (n > 0){
      /* tic ascendente: se vuelve más agudo e insistente al acercarse a cero */
      const f = 640 + (5 - Math.min(n, 5)) * 70;
      blip(f, 0, n <= 1 ? .13 : .09, n <= 1 ? .2 : .14, 'sine');
    } else {
      /* arranque: acorde breve que marca "ya" */
      blip(660, 0, .09, .16); blip(990, 0, .18, .15, 'sine', .07); blip(1320, 0, .24, .09, 'sine', .13);
    }
  }catch(e){}
}
function startWithCountdown(){
  if (running || cdTimer) return;
  let n = S.count;
  if (!n){ setRun(true); return; }
  const c = $('count'), cn = $('cn');
  const show = v => { cn.textContent = v; cn.classList.toggle('wide', String(v).length > 1); cn.classList.remove('pop'); void cn.offsetWidth; cn.classList.add('pop'); tap(10); countSound(v); };
  c.classList.add('active'); show(n);
  cdTimer = setInterval(() => {
    n--;
    if (n <= 0){ clearInterval(cdTimer); cdTimer = 0; c.classList.remove('active'); countSound(0); setRun(true); }
    else show(n);
  }, 1000);
}
function cancelCountdown(){ if (cdTimer){ clearInterval(cdTimer); cdTimer = 0; $('count').classList.remove('active'); } }
function hasSelection(){ const s = window.getSelection && window.getSelection(); return !!(s && !s.isCollapsed && String(s).trim()); }
function toggle(){ if (cdTimer){ cancelCountdown(); return; } if (hasSelection()) return; running ? setRun(false) : startWithCountdown(); }
$('play').onclick = () => { tap(10); toggle(); };
$('slower').onclick = () => { tap(6); S.speed = Math.max(1, S.speed - 1); saveS(); applySettings(); };
$('faster').onclick = () => { tap(6); S.speed = Math.min(20, S.speed + 1); saveS(); applySettings(); };

/* tocar el texto = pausa / reanudar; arrastrar = moverse a mano (pausa) */
scroller.addEventListener('click', () => { if ($('sheet').classList.contains('active')) return; toggle(); });
scroller.addEventListener('touchstart', () => { cancelCountdown(); if (running) setRun(false); }, {passive:true});
scroller.addEventListener('scroll', () => { if (!running){ pos = scroller.scrollTop; scheduleCur(); } }, {passive:true});

/* línea guía: resalta la línea que está en la guía (sin lecturas de layout: usa posiciones guardadas) */
let curEl = null, curRaf = 0;
function updateCur(){
  if (S.mode !== 'scroll' || !$('reader').classList.contains('active')) return;
  const ch = content.children;
  if (!offs.length || offs.length !== ch.length) cacheOffsets();
  if (!offs.length) return;
  const y = scroller.scrollTop + guideY;
  let idx = offs.length - 1;
  for (let i = 0; i < offs.length; i++){
    const t = offs[i][0];
    if (y <= t + offs[i][1]){ idx = i; break; }
  }
  const found = ch[idx] || null;
  if (found !== curEl){
    if (curEl) curEl.classList.remove('cur');
    curEl = found;
    if (curEl) curEl.classList.add('cur');
    const g = $('guide');
    if (g) g.classList.toggle('onvd', !!(curEl && curEl.classList.contains('vd')));
  }
}
function scheduleCur(){ if (curRaf) return; curRaf = requestAnimationFrame(() => { curRaf = 0; updateCur(); }); }
setInterval(() => { if ($('reader').classList.contains('active')) updateCur(); }, 400);

/* modo línea por línea */
function renderLine(){
  const e = flat[lineIdx]; if (!e) return;
  $('lineView').classList.add('active');
  const isD = e.t === 'd';
  $('lineDivider').textContent = isD ? e.text : '';
  const le = $('lineEnd'), pv = (isD && e.vi > 0) ? current.videos[e.vi - 1] : null;
  le.classList.toggle('on', !!pv); le.textContent = pv ? t('fin') + ' · ' + (pv.title || (t('video') + ' ' + e.vi)) : '';
  $('lineText').style.display = isD ? 'none' : 'block';
  $('lineText').textContent = isD ? '' : e.text;
  if (!isD){ const lt = $('lineText'); lt.classList.remove('in'); void lt.offsetWidth; lt.classList.add('in'); }
  $('lineTap').textContent = isD ? t('tapStart') : '';
  const nx = flat[lineIdx + 1];
  $('lineNext').textContent = (!isD && nx && nx.t === 'l') ? t('follows') + ': ' + nx.text : '';
  $('title').textContent = isD ? current.title : (current.title + ' · ' + (e.vi + 1) + ' · ' + (e.li + 1) + '/' + e.n);
}
function lineAdvance(){ if (S.mode !== 'line') return; if (lineIdx < flat.length - 1){ lineIdx++; renderLine(); } }
function lineBack(){ if (S.mode !== 'line') return; if (lineIdx > 0){ lineIdx--; renderLine(); } }
$('next').onclick = lineAdvance; $('prev').onclick = lineBack;
let ty = null;
$('lineView').addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive:true});
$('lineView').addEventListener('touchend', e => {
  if (ty === null) return; const dy = e.changedTouches[0].clientY - ty; ty = null;
  if (Math.abs(dy) > 60){ dy < 0 ? lineAdvance() : lineBack(); e.preventDefault(); }
});

$('back').onclick = () => { setRun(false); cancelCountdown(); releaseWake(); $('title').textContent = '—'; show('home'); };
document.addEventListener('keydown', e => {
  if (!$('reader').classList.contains('active')) return;
  if (S.mode === 'scroll'){
    if (e.key === ' ' ){ e.preventDefault(); toggle(); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight'){ e.preventDefault(); $('faster').click(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft'){ e.preventDefault(); $('slower').click(); }
  } else {
    if ([' ','ArrowRight','ArrowDown','PageDown'].includes(e.key)){ e.preventDefault(); lineAdvance(); }
    if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); lineBack(); }
  }
});

      const sp = document.createElement('span'); sp.textContent = tn(k, t_.n);
      b.append(i, sp); sw.appendChild(b);
    });
    const cur = biz ? S.btheme : S.theme;
    sw.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.v === cur));
  };
  window.renderThemes();
  /* idiomas */
  { const lg = $('segLang');
    LANGS.forEach(l => { const b = document.createElement('button'); b.dataset.v = l.k;
      b.innerHTML = '<span class="fl">' + l.fl + '</span><span>' + l.n + '</span><span class="ck">✓</span>'; lg.appendChild(b); }); }
  const ch = $('segFont');
  Object.keys(FONTS).forEach(k => {
    const f = FONTS[k], b = document.createElement('button'); b.dataset.v = k;
    const a = document.createElement('b'); a.textContent = 'Aa'; a.style.fontFamily = f.st;
    const s = document.createElement('small'); s.textContent = f.n;
    b.append(a, s); ch.appendChild(b);
  });
  ch.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ch.scrollTo({left: b.offsetLeft - (ch.clientWidth - b.offsetWidth) / 2, behavior: 'smooth'});
  });
  /* pestañas Texto / Color / Lectura */
  $('segTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; tap(6);
    $('segTab').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + b.dataset.v));
    syncThumbs();
  });
  /* modo transparente: al tocar un control, la hoja se vuelve casi invisible para ver el guion detrás */
  const sheet = $('sheet'); let tmr = 0, live = [];
  const clearLive = () => { live.forEach(e => e.classList.remove('live')); live = []; };
  function on(el){
    clearTimeout(tmr); clearLive();
    live = [el]; const lab = el.previousElementSibling; if (lab && lab.tagName === 'LABEL') live.push(lab);
    live.forEach(e => e.classList.add('live')); sheet.classList.add('ghost');
  }
  function off(ms){ clearTimeout(tmr); tmr = setTimeout(() => { sheet.classList.remove('ghost'); clearLive(); }, ms); }
  document.querySelectorAll('#pane-text input[type=range]').forEach(r => {
    ['pointerdown','touchstart','mousedown'].forEach(ev => r.addEventListener(ev, () => on(r), {passive:true}));
    ['pointerup','pointercancel','touchend','touchcancel','mouseup'].forEach(ev => r.addEventListener(ev, () => off(500), {passive:true}));
  });
  ['segFont'].forEach(id => {
    $(id).addEventListener('click', () => { on($(id)); off(1700); });
  });
  /* si una tipografía termina de cargar, se reacomoda sin perder la línea actual */
  if (document.fonts && document.fonts.addEventListener){
    document.fonts.addEventListener('loadingdone', () => { const a = anchorGet(); layoutGuide(); anchorSet(a); });
  }
})();
applySettings();

/* ---------- pronunciador (seleccionar palabra -> escuchar) ---------- */
(function(){
  const bar = $('pronBar'), wordEl = $('pronWord');
  const TTS = ('speechSynthesis' in window);
  if (!TTS){ return; } // sin soporte: la selección de texto sigue funcionando (copiar), solo no hay botones de voz
  let lastText = '';
  let voices = [];
  function loadVoices(){ const v = speechSynthesis.getVoices(); if (v && v.length) voices = v; }
  loadVoices();
  if ('onvoiceschanged' in speechSynthesis){ speechSynthesis.onvoiceschanged = loadVoices; }
  /* algunos navegadores (sobre todo en Android) tardan en entregar la lista de voces o no
     avisan con onvoiceschanged: se reintenta un par de segundos para no quedarse con 0 voces */
  let voiceTries = 0;
  (function waitVoices(){ if (voices.length || voiceTries++ > 20) return; loadVoices(); setTimeout(waitVoices, 150); })();

  /* elige, de entre las voces instaladas, la más natural para ese idioma:
     prioriza motores de calidad (Natural/Neural/Enhanced/Premium/Wavenet/Google) y evita las
     compactas/robóticas; si no hay ninguna del idioma exacto, cae al idioma base (es, en, pt, fr) */
  const QUALITY_HINTS = ['natural', 'neural', 'enhanced', 'premium', 'wavenet', 'siri', 'google'];
  const LOW_QUALITY_HINTS = ['compact', 'espeak', 'robot'];
  function score(v){
    const n = (v.name || '').toLowerCase();
    let s = 0;
    if (QUALITY_HINTS.some(h => n.includes(h))) s += 10;
    if (LOW_QUALITY_HINTS.some(h => n.includes(h))) s -= 10;
    if (v.localService) s += 1;      /* suele sonar más estable y sin retardo de red */
    if (v.default) s += 1;
    return s;
  }
  function pickVoice(lang){
    if (!voices.length) loadVoices();
    const exact = voices.filter(v => v.lang && v.lang.toLowerCase() === lang.toLowerCase());
    const base = lang.split('-')[0];
    const byBase = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(base));
    const pool = exact.length ? exact : byBase;
    if (!pool.length) return null;
    return pool.slice().sort((a, b) => score(b) - score(a))[0];
  }
  function speak(text, lang){
    if (!text) return;
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    const words = text.trim().split(/\s+/).length;
    /* una sola palabra se dice más despacio y clara; una frase fluye a ritmo casi natural */
    u.lang = lang; u.rate = words <= 2 ? 0.76 : 0.95; u.pitch = 1; u.volume = 1;
    const v = pickVoice(lang); if (v) u.voice = v;
    const say = () => { try{ speechSynthesis.speak(u); }catch(e){} };
    if (!voices.length){ setTimeout(say, 200); } else say();
  }
  function showBar(text){
    lastText = text;
    wordEl.textContent = text.length > 40 ? text.slice(0, 40) + '…' : text;
    bar.classList.add('show');
  }
  function hideBar(){ bar.classList.remove('show'); }
  function onSelChange(){
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed){ hideBar(); return; }
    const text = String(sel).trim();
    if (!text){ hideBar(); return; }
    const node = sel.anchorNode;
    const vp = $('viewport');
    if (!node || !vp.contains(node instanceof Element ? node : node.parentNode)){ hideBar(); return; }
    showBar(text);
  }
  document.addEventListener('selectionchange', () => { clearTimeout(onSelChange._t); onSelChange._t = setTimeout(onSelChange, 120); });
  { const box = $('pronLangs'); const short = {'es-MX':'MX','en':'EN','pt-PT':'PT','es-ES':'ES','fr':'FR'};
    LANGS.forEach(l => { const b = document.createElement('button'); b.className = 'alt';
      b.innerHTML = '<span>' + l.fl + '</span><small>' + short[l.k] + '</small>'; b.title = l.n;
      b.onclick = () => speak(lastText, l.tts); box.appendChild(b); }); }
  $('pronClose').onclick = () => {
    try{ window.getSelection().removeAllRanges(); }catch(e){}
    try{ speechSynthesis.cancel(); }catch(e){}
    hideBar();
  };
  $('back').addEventListener('click', () => { try{ speechSynthesis.cancel(); }catch(e){} hideBar(); });
})();
</script>
